# THIS FILE IS EXCLUSIVELY MAINTAINED IN THE AE ROOT PACKAGE. ANY CHANGES SHOULD BE DONE THERE.
# All changes will be deployed automatically to all the portions of this namespace package.

image: python:3.6


before_script:
  - python --version
  - pip install -r requirements.txt -r test_requirements.txt
  - pip install pylint-exit anybadge coverage-badge


pytest:
  script:
    - python -m pytest --cov-report html --cov=ae tests/
    - coverage report | tee coverage.txt
    # - anybadge --label=coverage --file=coverage.svg --value=69 --suffix='%%' 50=red 60=orange 80=yellow 100=green
    - coverage-badge -o coverage.svg -f
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    paths:
      - htmlcov/
      - coverage.txt
      - coverage.svg


flake8:
  # stage: test   # default stage
  script:
    - flake8 --max-line-length=120 ae

mypy:
  script:
    - python -m mypy ae

pylint:
  script:
    - mkdir ./pylint
    - pylint --output-format=text --max-line-length=120 ae | tee ./pylint/pylint.log || pylint-exit $?
    - PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' ./pylint/pylint.log)
    - anybadge --label=Pylint --file=pylint/pylint.svg --value=$PYLINT_SCORE 2=red 4=orange 8=yellow 10=green
    - echo "Pylint score is $PYLINT_SCORE"
  artifacts:
    paths:
      - ./pylint/


deploy_staging:
  stage: deploy
  variables:
    TWINE_USERNAME: $PYPI_USERNAME
    TWINE_PASSWORD: $PYPI_PASSWORD
  before_script:
     - pip install twine
     - python setup.py sdist
  script:
    - twine upload --verbose dist/*
  only:
    - master


pages:
  stage: deploy
  dependencies:
    - pytest
    - pylint
  script:
    # - mkdir public/
    - mv htmlcov/ public/
    - mv coverage.txt public/
    - mv coverage.svg public/
    - mv pylint/pylint.svg public/
    - mv pylint/pylint.log public/
  artifacts:
    paths:
      - public
  only:
    - master
