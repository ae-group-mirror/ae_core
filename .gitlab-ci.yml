# THIS FILE IS EXCLUSIVELY MAINTAINED IN THE AE ROOT PACKAGE. ANY CHANGES SHOULD BE DONE THERE.
# All changes will be deployed automatically to all the portions of this namespace package.

image: python:3.6


before_script:
  - python --version
  - pip install -r requirements.txt -r test_requirements.txt


pytest:
  # stage: test   # default stage
  script:
    - python -m pytest --cov=ae tests/


flake8:
  # stage: test   # default stage
  script:
    - flake8 --max-line-length=120 ae

mypy:
  script:
    - python -m mypy ae

pylint:
  allow_failure: true       # pylint is too picky but still useful for manual code smell checks
  before_script:
    - python --version
    - pip install -r requirements.txt -r test_requirements.txt    # global before_script not executed if job has one too
    - pip install pylint-exit anybadge
  script:
    - mkdir ./pylint
    - pylint --output-format=text --max-line-length=120 ae | tee ./pylint/pylint.log || pylint-exit $?
    - PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' ./pylint/pylint.log)
    - anybadge --label=Pylint --file=pylint/pylint.svg --value=$PYLINT_SCORE 2=red 4=orange 8=yellow 10=green
    - echo "Pylint score is $PYLINT_SCORE"
  artifacts:
    paths:
      - ./pylint/


deploy_staging:
  stage: deploy
  variables:
    TWINE_USERNAME: $PYPI_USERNAME
    TWINE_PASSWORD: $PYPI_PASSWORD
  before_script:
     - pip install twine
     - python setup.py sdist
  script:
    - twine upload --verbose dist/*
  only:
    - master
